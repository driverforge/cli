name: Release preflight

# Prove this repository can cut a release, without cutting one.
#
# Runs exactly the credential checks release.yml performs before it publishes
# anything — resolve the bot App token, assume the AWS release role, sign a
# throwaway digest with the release key — and then stops. Nothing is built, uploaded,
# tagged, or pushed to a tap.
#
# Two reasons this exists as its own workflow rather than a flag on release.yml:
#
#   - Rehearsing a release on a new repository (the OSS mirror) needs the
#     credential path exercised BEFORE a tag exists, and a dry run that reached
#     GoReleaser would push a test version to the PUBLIC Homebrew tap and Scoop
#     bucket, where real users' `brew upgrade` would find it.
#   - Credentials rot silently. v0.5.0 failed because an OIDC trust's subject
#     no longer matched after a repo rename, and the failure surfaced
#     only once binaries and both taps were already published. This answers
#     "could we release right now?" at any time, for free.
#
# The environment below is load-bearing: the release role trusts a subject ending
# in `:environment:release`, so a run without it presents a different subject and
# fails auth for a reason that looks like a broken federation but is not.

on:
  workflow_dispatch:

permissions:
  # OIDC token for the release role. Nothing else — this workflow writes nothing.
  id-token: write
  contents: read

concurrency:
  group: release-preflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Publishing belongs to the PUBLIC mirror. This repo carries the org's
      # `oss-mirror` repository property — the flag for a private repo that
      # publishes to a public one, and the same property the mirror rulesets
      # key on.
      #
      # This workflow is workflow_dispatch ONLY, so a blocked run always means a
      # person asked for something that is not going to happen — it fails rather
      # than skips, because a skipped job is grey and sends no mail. Workflows
      # that also fires automatically (release.yml, on a tag) gates on a
      # guard job instead, so its automatic runs skip quietly.
      #
      # It is read over the API rather than tested in a job-level `if:`, because
      # custom properties are not in the `github` context (only `vars` is).
      #
      # Fails CLOSED. `custom_properties` is always an object on this endpoint
      # ({} when nothing is set), so its ABSENCE means the response is not the
      # shape we think it is — and an unrecognised response must refuse rather
      # than read as "not a mirror". A token blip or API error refuses for the
      # same reason: publishing is the one outcome that cannot be undone.
      - name: refuse to run the release preflight from a mirrored private repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resp="$(gh api "repos/${GITHUB_REPOSITORY}")"
          if ! printf '%s' "$resp" | jq -e 'has("custom_properties")' >/dev/null; then
            echo "::error::could not read repository properties — refusing to run the release preflight"
            exit 1
          fi
          # Only an ABSENT property permits publishing. Any value means this repo
          # mirrors somewhere, whatever that value encodes: the property began as
          # true|false and is becoming a platform selector (actions|buildkite), so a
          # test for "true" would read "actions" as "not a mirror" and publish from
          # the private repo. `false` stays permissive for the transition.
          mirror="$(printf '%s' "$resp" | jq -r '.custom_properties["oss-mirror"] // ""')"
          case "$mirror" in
            "" | false) : ;;
            *)
              echo "::error::${GITHUB_REPOSITORY} publishes to a public mirror (oss-mirror=${mirror}) — run the release preflight from the mirror instead"
              exit 1
              ;;
          esac
          echo "oss-mirror is not set on ${GITHUB_REPOSITORY} — proceeding."
      # Which credentials actually resolve here. Organisation secrets can be
      # scoped to private repositories only, in which case a public repo
      # silently receives empty strings — and SENTRY_DSN / MIXPANEL_TOKEN pass
      # through goreleaser's `envOrDefault "" `, so a release would SUCCEED and
      # ship a build with telemetry quietly unconfigured. Presence only; no
      # value is ever printed.
      - name: Report credential resolution
        env:
          BOT_KEY: ${{ secrets.DRIVERFORGE_BOT_PRIVATE_KEY }}
          BOT_CLIENT_ID: ${{ vars.DRIVERFORGE_BOT_CLIENT_ID }}
          RELEASE_ROLE: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          SENTRY_DSN: ${{ vars.DRIVERFORGE_SENTRY_DSN }}
          MIXPANEL_TOKEN: ${{ vars.DRIVERFORGE_MIXPANEL_TOKEN }}
        run: |
          set -uo pipefail
          missing=0
          check() {
            if [ -n "${2:-}" ]; then
              printf '  %-34s present\n' "$1"
            else
              printf '  %-34s MISSING\n' "$1"
              missing=1
            fi
          }
          echo "secrets:"
          check "DRIVERFORGE_BOT_PRIVATE_KEY" "$BOT_KEY"
          echo "variables:"
          check "DRIVERFORGE_BOT_CLIENT_ID"    "$BOT_CLIENT_ID"
          check "AWS_RELEASE_ROLE_ARN"         "$RELEASE_ROLE"
          check "DRIVERFORGE_SENTRY_DSN"       "$SENTRY_DSN"
          check "DRIVERFORGE_MIXPANEL_TOKEN"   "$MIXPANEL_TOKEN"
          if [ "$missing" -ne 0 ]; then
            echo "::error::a credential release.yml needs does not resolve in ${GITHUB_REPOSITORY}"
            exit 1
          fi

      # Same App, same scope as release.yml. Proves the installation covers the
      # tap repos from HERE — an App installed on one repo is not installed on
      # its mirror.
      - name: Mint tap token from driverforge-bot
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DRIVERFORGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DRIVERFORGE_BOT_PRIVATE_KEY }}
          owner: driverforge
          repositories: |
            homebrew-tap
            scoop-bucket

      # When the role is refused, read the subject GitHub presented from
      # `gh api repos/<repo>/actions/oidc/customization/sub` rather than
      # constructing it — it carries org and repo IDs that survive renames, and
      # guessing it is what broke v0.5.0.
      - name: Assume the release role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-west-2

      # Assuming the role proves the trust resolves; it does not prove the role
      # may sign, or that the key's material has been imported (a key in
      # PendingImport refuses to sign). Exercise the real operation.
      - name: Verify the signing key is usable
        env:
          RELEASE_SIGNING_KEY: release-signing-v2
          RELEASE_SIGNING_KEY_ALIAS: alias/driverforge-release-signing-v2
        run: |
          set -euo pipefail
          printf 'release-preflight' | openssl dgst -sha256 -binary > preflight.digest
          aws kms sign \
            --key-id "$RELEASE_SIGNING_KEY_ALIAS" \
            --message fileb://preflight.digest --message-type DIGEST \
            --signing-algorithm RSASSA_PKCS1_V1_5_SHA_256 \
            --query Signature --output text > /dev/null
          echo "signing key $RELEASE_SIGNING_KEY is usable from ${GITHUB_REPOSITORY}"

      - name: Verdict
        run: echo "${GITHUB_REPOSITORY} can cut a release. Nothing was published."
