name: Release preflight

# Prove this repository can cut a release, without cutting one.
#
# Runs exactly the credential checks release.yml performs before it publishes
# anything — resolve the bot App token, federate to Azure, sign a throwaway
# digest with the release key — and then stops. Nothing is built, uploaded,
# tagged, or pushed to a tap.
#
# Two reasons this exists as its own workflow rather than a flag on release.yml:
#
#   - Rehearsing a release on a new repository (the OSS mirror) needs the
#     credential path exercised BEFORE a tag exists, and a dry run that reached
#     GoReleaser would push a test version to the PUBLIC Homebrew tap and Scoop
#     bucket, where real users' `brew upgrade` would find it.
#   - Credentials rot silently. v0.5.0 failed because a federated credential's
#     subject no longer matched after a repo rename, and the failure surfaced
#     only once binaries and both taps were already published. This answers
#     "could we release right now?" at any time, for free.
#
# The environment below is load-bearing: the federated credential's subject ends
# in `:environment:release`, so a run without it presents a different subject and
# fails auth for a reason that looks like a broken federation but is not.

on:
  workflow_dispatch:

permissions:
  # OIDC token for azure/login. Nothing else — this workflow writes nothing.
  id-token: write
  contents: read

concurrency:
  group: release-preflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Which credentials actually resolve here. Organisation secrets can be
      # scoped to private repositories only, in which case a public repo
      # silently receives empty strings — and SENTRY_DSN / MIXPANEL_TOKEN pass
      # through goreleaser's `envOrDefault "" `, so a release would SUCCEED and
      # ship a build with telemetry quietly unconfigured. Presence only; no
      # value is ever printed.
      - name: Report credential resolution
        env:
          BOT_KEY: ${{ secrets.DRIVERFORGE_BOT_PRIVATE_KEY }}
          STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          BOT_CLIENT_ID: ${{ vars.DRIVERFORGE_BOT_CLIENT_ID }}
          SIGNER_CLIENT_ID: ${{ vars.AZURE_RELEASE_SIGNER_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          SENTRY_DSN: ${{ vars.DRIVERFORGE_SENTRY_DSN }}
          MIXPANEL_TOKEN: ${{ vars.DRIVERFORGE_MIXPANEL_TOKEN }}
        run: |
          set -uo pipefail
          missing=0
          check() {
            if [ -n "${2:-}" ]; then
              printf '  %-34s present\n' "$1"
            else
              printf '  %-34s MISSING\n' "$1"
              missing=1
            fi
          }
          echo "secrets:"
          check "DRIVERFORGE_BOT_PRIVATE_KEY" "$BOT_KEY"
          check "AZURE_STORAGE_KEY"           "$STORAGE_KEY"
          echo "variables:"
          check "DRIVERFORGE_BOT_CLIENT_ID"    "$BOT_CLIENT_ID"
          check "AZURE_RELEASE_SIGNER_CLIENT_ID" "$SIGNER_CLIENT_ID"
          check "AZURE_TENANT_ID"              "$TENANT_ID"
          check "AZURE_KEY_VAULT"              "$KEY_VAULT"
          check "AZURE_STORAGE_ACCOUNT"        "$STORAGE_ACCOUNT"
          check "DRIVERFORGE_SENTRY_DSN"       "$SENTRY_DSN"
          check "DRIVERFORGE_MIXPANEL_TOKEN"   "$MIXPANEL_TOKEN"
          if [ "$missing" -ne 0 ]; then
            echo "::error::a credential release.yml needs does not resolve in ${GITHUB_REPOSITORY}"
            exit 1
          fi

      # Same App, same scope as release.yml. Proves the installation covers the
      # tap repos from HERE — an App installed on one repo is not installed on
      # its mirror.
      - name: Mint tap token from driverforge-bot
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DRIVERFORGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DRIVERFORGE_BOT_PRIVATE_KEY }}
          owner: driverforge
          repositories: |
            homebrew-tap
            scoop-bucket

      # The subject GitHub presents is logged by this action. When registering a
      # federated credential for a NEW repository, read the subject from a failed
      # run here rather than constructing it — it carries org and repo IDs that
      # survive renames, and guessing it is what broke v0.5.0.
      - name: Authenticate to Azure for signing
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_RELEASE_SIGNER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Logging in proves the federation resolves; it does not prove this
      # identity may sign. Those fail at different layers (Entra federation vs
      # the Key Vault role assignment), so exercise the real operation.
      - name: Verify the signing key is usable
        env:
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          RELEASE_SIGNING_KEY: release-signing-v1
        run: |
          set -euo pipefail
          az keyvault key sign \
            --vault-name "$AZURE_KEY_VAULT" \
            --name "$RELEASE_SIGNING_KEY" \
            --algorithm RS256 \
            --digest "$(printf 'release-preflight' | openssl dgst -sha256 -binary | base64)" \
            --query signature -o tsv > /dev/null
          echo "signing key $RELEASE_SIGNING_KEY is usable from ${GITHUB_REPOSITORY}"

      - name: Verdict
        run: echo "${GITHUB_REPOSITORY} can cut a release. Nothing was published."
