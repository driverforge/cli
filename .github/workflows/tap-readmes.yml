# Publishes the README sources in contrib/taps/ to the public tap repos
# (homebrew-tap, scoop-bucket). Runs automatically when a merge to main
# touches the sources (idempotent — skips when content already matches);
# workflow_dispatch remains for manual re-runs.
#
# The commit is created with a driverforge-bot installation token, so both
# the author and the push actor are driverforge-bot[bot]: the tap repos are
# public and no employee identity may appear in their history. For the same
# reason, never push to those repos by hand.
name: Sync tap READMEs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["contrib/taps/**"]

# contents:read is for checking out THIS repo (the README sources); the writes
# to the tap repos happen via the minted app token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Publishing belongs to the PUBLIC mirror. This repo carries the org's
  # `oss-mirror` repository property — the flag for a private repo that
  # publishes to a public one, and the same property the mirror rulesets key on.
  #
  # Read over the API because custom properties are not in the `github` context
  # (only `vars` is), so they cannot be tested in a job-level `if:`.
  #
  # Fails CLOSED: `custom_properties` is always an object on this endpoint ({}
  # when nothing is set), so its absence means the response is not the shape we
  # expect, and an unrecognised response must refuse rather than read as "not a
  # mirror". API and token errors refuse for the same reason.
  guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          allowed=false
          reason=""
          if resp="$(gh api "repos/${GITHUB_REPOSITORY}" 2>/dev/null)" \
            && printf '%s' "$resp" | jq -e 'has("custom_properties")' >/dev/null 2>&1; then
            # Only an ABSENT property permits publishing. Any value means this repo
            # mirrors somewhere, whatever that value encodes: the property began as
            # true|false and is becoming a platform selector (actions|buildkite), so a
            # test for "true" would read "actions" as "not a mirror" and publish from
            # the private repo. `false` stays permissive for the transition.
            mirror="$(printf '%s' "$resp" | jq -r '.custom_properties["oss-mirror"] // ""')"
            case "$mirror" in
              "" | false) allowed=true ;;
              *) reason="${GITHUB_REPOSITORY} publishes to a public mirror (oss-mirror=${mirror})" ;;
            esac
          else
            reason="could not read the oss-mirror property on ${GITHUB_REPOSITORY}"
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "allowed=$allowed${reason:+ — $reason}"

      # An automatic run skips quietly: nobody is waiting on it, and a red tick
      # on every ordinary merge touching contrib/taps/** would teach people to ignore this workflow.
      # A run someone ASKED for fails, because a skipped job is grey and sends no
      # mail — the person is waiting on an outcome that is not going to happen.
      - name: refuse a manual run from a mirrored private repo
        if: steps.check.outputs.allowed != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "::error::${{ steps.check.outputs.reason }} — run this on the mirror instead"
          exit 1

  sync:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: homebrew-tap
            source: contrib/taps/homebrew-tap-README.md
          - repo: scoop-bucket
            source: contrib/taps/scoop-bucket-README.md
    steps:
      - uses: actions/checkout@v7

      - name: Mint token from driverforge-bot
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DRIVERFORGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DRIVERFORGE_BOT_PRIVATE_KEY }}
          owner: driverforge
          repositories: ${{ matrix.repo }}

      - name: Publish README.md
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ matrix.repo }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          # Update-or-create: the contents API needs the current blob SHA to
          # update an existing file; omit it and the call creates the file
          # (initialising the default branch in a still-empty repo).
          sha=$(gh api "repos/driverforge/$REPO/contents/README.md" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ] && [ "$(gh api "repos/driverforge/$REPO/contents/README.md" --jq .content | tr -d '\n')" = "$(base64 -w0 < "$SOURCE")" ]; then
            echo "README.md already up to date — nothing to publish."
            exit 0
          fi
          args=(-f message="docs: sync README from driverforge/cli contrib/taps" -f content="$(base64 -w0 < "$SOURCE")")
          [ -n "$sha" ] && args+=(-f sha="$sha")
          gh api -X PUT "repos/driverforge/$REPO/contents/README.md" "${args[@]}" --jq '.commit.html_url'
