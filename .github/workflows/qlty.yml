name: Qlty

# The maintainability gate. Shared with our TypeScript repo, which replaced the
# Qlty Cloud GitHub App for the same reasons that apply here: the
# App reported failures only as inline review comments plus a link to a
# login-walled page on qlty.sh — nothing a person or an agent could read out of
# the build — and it billed per run. When the credit ran out the check stopped
# running and simply reported "Qlty did not run because you are out of minutes",
# which is what prompted this.
#
# Everything here is the open-source CLI. Findings land in the step log, as
# GitHub annotations, on the job summary, as a sticky PR comment, and as inline
# review comments. Nothing is behind a login and nothing is metered.
#
# Like the App, this fails on every smell in a file the PR changed, not only on
# ones the PR wrote — see the header of scripts/qlty-diff.js.
#
# Deliberately its own workflow rather than a job in ci.yml: it needs no Go
# toolchain or module download (the gate script is dependency-free node), and
# keeping it separate means a maintainability failure and a test failure are
# distinguishable at a glance on the PR.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # A `pull_request` workflow runs from the PR's own branch, so PRs opened
  # before this file landed on main get no Qlty check until they merge main.
  # This runs the gate against any open PR from main, without waiting for that.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check
        required: true

concurrency:
  group: qlty-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  # Pinned deliberately. An unpinned CLI would move the gate's thresholds under
  # PRs that did not ask for it, and qlty's duplication detector already has
  # enough run-to-run variance. Same version and checksum as the monorepo's
  # gate; the checksum was re-verified against the published asset on adoption.
  QLTY_VERSION: 0.640.0
  QLTY_SHA256: 7b220858271755c2a4e7c5b733b77b7764ed4715ace102e082c64c3675bd5cd3
  # The gate scripts are plain CommonJS with no dependencies, so this only has
  # to be a node new enough to run them.
  NODE_VERSION: "24"

jobs:
  qlty:
    name: Qlty
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # Full history: the gate compares against the merge base, and creates a
      # worktree at it. On `pull_request` this checks out the merge ref, whose
      # diff against base.sha is exactly the PR's changes. On dispatch it takes
      # the branch tip instead: the merge ref is only recomputed when GitHub gets
      # round to it, and a stale one puts everything merged into main since into
      # the PR's diff. The tip plus a merge base is deterministic, and is what
      # `make qlty` does locally.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || '' }}

      # A PR ref arrives without the base branch, which the gate needs to find
      # the merge base.
      - name: Fetch the base branch
        if: inputs.pr
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # The gate lives on main, and a dispatched PR is by definition one that
      # predates it — that is what the trigger is for — so its tree has no
      # scripts/qlty-*.js to run. Take the gate and its config from main. They
      # land as uncommitted files, outside `git diff base..HEAD`, so they are
      # never mistaken for files the PR changed.
      - name: Take the gate from main
        if: inputs.pr
        run: |
          git checkout origin/main -- \
            .qlty scripts/qlty-gate.js scripts/qlty-diff.js scripts/qlty-review.js
          git reset -q

      - name: Resolve the base commit
        id: base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: echo "ref=${EVENT_BASE:-origin/main}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install qlty
        run: |
          set -euo pipefail
          asset="qlty-aarch64-unknown-linux-gnu"
          curl -fsSL -o "/tmp/${asset}.tar.xz" \
            "https://github.com/qltysh/qlty/releases/download/v${QLTY_VERSION}/${asset}.tar.xz"
          echo "${QLTY_SHA256}  /tmp/${asset}.tar.xz" | sha256sum -c -
          tar -xJf "/tmp/${asset}.tar.xz" -C /tmp
          sudo install "/tmp/${asset}/qlty" /usr/local/bin/qlty
          qlty --version

      # The gate script is plain node with no dependencies, so there is no
      # install step between checkout and running it.
      - name: Run the maintainability gate
        id: gate
        run: |
          set +e
          node scripts/qlty-gate.js --base "${{ steps.base.outputs.ref }}" --out-dir reports/qlty
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload findings
        if: always() && hashFiles('reports/qlty/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: qlty-findings
          path: reports/qlty/
          retention-days: 14

      # Nice-to-haves below; neither may fail the build. The gate's verdict is
      # the step above, and a commenting failure (a fork PR with a read-only
      # token, a race on the review API) must not turn a clean branch red.
      - name: Comment on the PR
        if: always() && steps.gate.outputs.exit_code != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          marker="<!-- driverforge-qlty -->"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # No report means the gate crashed rather than reached a verdict. Say
          # so — a red check with nothing readable attached is the thing this
          # workflow exists to stop producing.
          if [ -f reports/qlty/report.md ]; then
            body="${marker}"$'\n'"$(cat reports/qlty/report.md)"
          else
            body="${marker}"$'\n'"### 🧹 Qlty maintainability"$'\n\n'
            body+="The gate did not run to completion, so there is no verdict here — this is a tooling failure, not a finding about your code. The error is in the [job log](${run_url})."
          fi
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
            echo "Updated comment ${existing}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
            echo "Created comment"
          fi

      - name: Review the offending lines
        if: always() && steps.gate.outputs.exit_code == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/qlty-review.js reports/qlty/findings.json

      # A dispatched run's check run is reported against the ref it ran on —
      # main — not against the PR's head commit, so a required `Qlty` check on
      # the PR sits at "Expected — waiting for status to be reported" forever
      # however many times it is dispatched. The PRs that predate the gate are
      # exactly the ones that need this, so the verdict is posted as a commit
      # status on the head SHA where branch protection can see it. Not
      # continue-on-error: on this path, posting the status *is* the deliverable.
      - name: Report the verdict on the PR head
        if: always() && inputs.pr && steps.gate.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ inputs.pr }}" --jq .head.sha)
          case "$EXIT_CODE" in
            0) state=success; desc="No code smells in the files this branch changed" ;;
            1) state=failure; desc="Code smells in files this branch changed — see the run log" ;;
            *) state=error;   desc="The gate did not complete — see the run log" ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state="$state" \
            -f context=Qlty \
            -f description="$desc" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          echo "Reported $state on $sha"

      - name: Fail if the branch added code smells
        if: steps.gate.outputs.exit_code != '0'
        run: exit 1
