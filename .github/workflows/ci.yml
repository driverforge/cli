name: CI

on:
  push:
    branches: [main]
  # "edited" (non-default) re-runs the mirror gate when the PR title or body
  # changes: those become the squash-merge message, which is what syncs to the
  # public mirror, so without it an edit after a green run could put an
  # unscrubbable reference into an immutable public commit.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: build
        run: make build

      - name: test (race)
        run: go test -race -shuffle=on ./...

      - name: coverage (informational, non-gating)
        continue-on-error: true
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

  # Mirror gate. This repo publishes an allowlist of its files to the public
  # mirror, so nothing that must stay internal may reach main.
  #
  # It is the whole guarantee. Nothing checks the mirror after the fact, because
  # a published commit message is immutable and the only remedy would be a
  # re-seed — so the check has to run while the content can still be changed.
  #
  # Add `mirror_clean` to the required checks on main; `test` and `Qlty` alone
  # do not cover it.
  mirror_clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: published files are mirror-clean
        run: tools/check-mirror-tree

      # What actually becomes the mirror commit message, per this repo's merge
      # settings: squash_merge_commit_title = COMMIT_OR_PR_TITLE and
      # squash_merge_commit_message = COMMIT_MESSAGES. So the PR title and the
      # branch's commit messages are checked, and the PR DESCRIPTION is not —
      # it never reaches the message, and a description citing the ticket that
      # motivated the change is normal and should not fail a build.
      - name: squash-merge message is mirror-clean
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$PR_TITLE"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[].commit.message'
          } | tools/check-mirror-message
