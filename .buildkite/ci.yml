# CI for the Driverforge CLI.
#
# Runs on every pull request, including those from forks: gofmt and vet, a
# build, then the test suite under the race detector.
#
# Reproduce any of it locally — the commands are the same ones CI runs:
#
#   make fmt-check
#   make vet
#   make build
#   go test -race -shuffle=on ./...
#
# The Go toolchain is pinned to the version in go.mod, so a pull request fails
# for its own change rather than for a toolchain that moved underneath it.

agents:
  queue: linux-small-public

steps:
  - label: ':mag: Lint'
    key: lint
    notify:
      - github_commit_status:
          context: buildkite/lint
    timeout_in_minutes: 15
    plugins: &go
      - docker#v5.11.0:
          image: golang:1.25.8
          # NOT root. Root ignores file permission bits, so a test that forces
          # a write to fail by making the target read-only sees it succeed:
          #
          #   --- FAIL: TestApplyChangesFailedWriteRestoresBackup
          #       applyChanges should fail writing a read-only file
          #
          # propagate-uid-gid was tried first and does the wrong thing here: it
          # propagates the AGENT's uid, and the hosted agents run as root, so it
          # faithfully propagated root.
          #
          # Nobody runs this CLI as root, so the behaviour the test asserts is
          # the real one — the environment is what should match it.
          user: "1000:1000"
          environment:
            - HOME=/tmp
            - GOCACHE=/tmp/go-build
            - GOMODCACHE=/tmp/go-mod
    command:
      - make fmt-check
      - make vet

  - label: ':hammer: Build'
    key: build
    notify:
      - github_commit_status:
          context: buildkite/build
    timeout_in_minutes: 15
    plugins: *go
    command: make build

  - label: ':go: Test'
    key: test
    notify:
      - github_commit_status:
          context: buildkite/test
    timeout_in_minutes: 20
    # -shuffle catches tests that only pass in declaration order; -race catches
    # what both of those hide.
    plugins: *go
    command: go test -race -shuffle=on ./...
