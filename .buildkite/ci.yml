# CI for the Driverforge CLI.
#
# Runs on every pull request, including those from forks: gofmt and vet, a
# build, the test suite under the race detector, and a check for known
# vulnerabilities reachable from the code.
#
# Reproduce any of it locally — the commands are the same ones CI runs:
#
#   make fmt-check
#   make vet
#   make build
#   go test -race -shuffle=on ./...
#   make vuln
#
# THE IMAGE PIN BELOW IS THE TOOLCHAIN, not go.mod's `go` directive. The
# official golang images set GOTOOLCHAIN=local, so Go builds with exactly what
# the image ships. go.mod is a floor for consumers; the pin is what compiles
# here. It is also a security input: the vulnerability check reports standard
# library advisories against the version that did the build, so bumping the
# pin is how those get fixed.

agents:
  queue: linux-small-public

steps:
  - label: ':mag: Lint'
    key: lint
    notify:
      - github_commit_status:
          context: buildkite/lint
    timeout_in_minutes: 15
    plugins: &go
      - docker#v5.14.0:
          image: golang:1.27.2
          environment:
            # The agent's home is not the container's. Without these, Go has
            # nowhere writable to cache and fails before compiling anything.
            - HOME=/tmp
            - GOCACHE=/tmp/go-build
            - GOMODCACHE=/tmp/go-mod
    command:
      - make fmt-check
      - make vet

  - label: ':hammer: Build'
    key: build
    notify:
      - github_commit_status:
          context: buildkite/build
    timeout_in_minutes: 15
    plugins: *go
    command: make build

  - label: ':go: Test'
    key: test
    notify:
      - github_commit_status:
          context: buildkite/test
    timeout_in_minutes: 20
    # -shuffle catches tests that only pass in declaration order; -race catches
    # what both of those hide.
    #
    # This step alone runs as a NON-ROOT user, because root ignores file
    # permission bits and one test forces a write to fail by making its target
    # read-only:
    #
    #   --- FAIL: TestApplyChangesFailedWriteRestoresBackup
    #       applyChanges should fail writing a read-only file
    #
    # As root that write succeeds and the assertion does not. Nobody runs this
    # CLI as root, so the behaviour the test asserts is the real one and the
    # environment is what should match it.
    #
    # Only this step, deliberately. The agent checks out as root, so a non-root
    # container cannot write into the workspace — which lint and build both do
    # (`go build -o driverforge`, and VCS stamping reading .git). Testing does
    # not: the caches are in /tmp and test binaries build under TMPDIR.
    #
    # propagate-uid-gid does the wrong thing here — it propagates the AGENT's
    # uid, and the hosted agents are root, so it faithfully propagated root.
    #
    # Spelled out rather than merged onto the anchor above: a YAML merge key is
    # not something this pipeline should depend on the parser supporting.
    plugins:
      - docker#v5.14.0:
          image: golang:1.27.2
          user: "1000:1000"
          environment:
            - HOME=/tmp
            - GOCACHE=/tmp/go-build
            - GOMODCACHE=/tmp/go-mod
    command: go test -race -shuffle=on ./...

  # Symbol-level reachability, standard library included. A failure with no
  # diff usually means a new advisory was published; see `make vuln`.
  - label: ':lock: Vulnerabilities'
    key: vuln
    notify:
      - github_commit_status:
          context: buildkite/vuln
    timeout_in_minutes: 15
    plugins: *go
    command: make vuln
